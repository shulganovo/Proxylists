name: Update proxies.txt

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Gist
        run: |
          curl -L --fail \
            "https://gist.githubusercontent.com/SlavaKat/2d75a18830db8315ee79d58f5ee62e30/raw/" \
            -o source1.txt

      - name: Download GitHub list
        run: |
          curl -L --fail \
            "https://github.com/terik21/HiddifySubs-VlessKeys/raw/refs/heads/main/main" \
            -o source2.txt

      - name: Create proxies.txt
        run: |
          cat source1.txt source2.txt > combined.txt

          grep -E '^(vless|vmess|trojan|ss|ssr|hysteria|hysteria2)://' combined.txt \
            | grep -Eiv '(🇷🇺|Россия|\bRU\b|BRIDGE|LTE)' \
            | sort -u \
            > proxies.txt

          echo "Количество прокси:"
          wc -l proxies.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- proxies.txt; then
            echo "Изменений нет"
          else
            git add proxies.txt
            git commit -m "Update proxies.txt"
            git push
          fi
