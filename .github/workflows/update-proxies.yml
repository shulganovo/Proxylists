```yaml
name: Update proxies.txt

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source lists
        run: |
          curl -L --fail \
            "https://gist.githubusercontent.com/SlavaKat/2d75a18830db8315ee79d58f5ee62e30/raw/" \
            -o source1.txt

          curl -L --fail \
            "https://github.com/terik21/HiddifySubs-VlessKeys/raw/refs/heads/main/main" \
            -o source2.txt

      - name: Merge, filter and remove duplicates
        run: |
          cat source1.txt source2.txt \
            | grep -E '^(vless|vmess|trojan|ss|ssr|hysteria|hysteria2)://' \
            | grep -Eiv '(🇷🇺|Россия|\bRU\b|BRIDGE|LTE)' \
            | sed 's/[[:space:]]*-[[:space:]]*[0-9]+[[:space:]]*%F0%9F%87%.*$//' \
            | sort -u \
            > proxies.txt

          echo "Result:"
          wc -l proxies.txt

      - name: Check and commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- proxies.txt; then
            echo "proxies.txt has not changed"
          else
            git add proxies.txt
            git commit -m "Update proxies.txt"
            git push
          fi
```
