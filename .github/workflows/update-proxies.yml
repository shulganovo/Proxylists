name: Update proxies.txt

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download list
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/flaafix/AetrisVPN/refs/heads/main/AetrisVPN.txt" \
            -o proxies.txt

      - name: Download list
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/flaafix/AetrisVPN-black-list/refs/heads/main/configs.txt" \
            -o proxies.txt

      - name: Filter list
        run: |
          grep -Eiv '(🇷🇺|Россия|(^|[^A-Za-z])RU([^A-Za-z]|$)|BRIDGE|LTE)' proxies.txt > proxies.tmp
          mv proxies.tmp proxies.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- proxies.txt; then
            echo "proxies.txt has not changed"
          else
            git add proxies.txt
            git commit -m "Update proxies.txt"
            git push
          fi
